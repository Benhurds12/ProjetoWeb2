name: Testes e Cobertura (Go)

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Baixar dependências
        run: go mod download

      - name: Rodar testes e gerar relatório de cobertura
        run: go test -v -coverprofile=coverage.out ./internal/services/...

      - name: Exibir Porcentagem Total de Cobertura
        run: go tool cover -func=coverage.out | grep "total:"